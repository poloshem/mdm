<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — Miracle and Deliverance Ministry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  :root{
    --indigo:#1E3A5F;
    --indigo-deep:#122842;
    --green:#3FA66B;
    --green-deep:#2E7F52;
    --teal:#2E7D6B;
    --ivory:#FAF6EE;
    --paper:#FFFFFF;
    --ink:#2B2620;
    --ink-soft:#5B564C;
    --line:#E7E0D2;
    --radius-s:6px;
    --radius-m:10px;
    --maxw:1160px;
  }

  body{
    margin:0;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:var(--ivory);
    line-height:1.5;
  }

  h1,h2,h3{font-family:'Lora',serif;margin:0;color:var(--indigo);font-weight:600;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 32px;}
  .section-head{margin-bottom:32px;}
  .kicker{color:var(--teal);font-weight:600;font-size:14px;margin-bottom:10px;}
  .gallery-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:22px;
  }
  .gallery-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius-m);
    overflow:hidden;
    box-shadow:0 8px 20px rgba(18,40,66,.04);
  }
  .gallery-card img{
    width:100%;
    height:260px;
    object-fit:cover;
    display:block;
  }
  @media (max-width: 820px){
    .gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  }
  @media (max-width: 560px){
    .gallery-grid{grid-template-columns:1fr;}
    .wrap{padding:0 20px;}
  }
</style>
</head>
<body>
<header></header>

<main>
  <section>
    <div class="wrap">
      <div class="section-head">
        <div>
          <div class="kicker">Gallery</div>
          <h1>Ministry in pictures</h1>
        </div>
      </div>
      <div class="gallery-grid">
        <div class="gallery-card"><img src="assets/image1.jpg" alt="Ministry gallery image 1"></div>
        <div class="gallery-card"><img src="assets/image2.jpg" alt="Ministry gallery image 2"></div>
        <div class="gallery-card"><img src="assets/image3.jpg" alt="Ministry gallery image 3"></div>
        <div class="gallery-card"><img src="assets/image4.jpg" alt="Ministry gallery image 4"></div>
        <div class="gallery-card"><img src="assets/image5.jpg" alt="Ministry gallery image 5"></div>
        <div class="gallery-card"><img src="assets/image6.jpg" alt="Ministry gallery image 6"></div>
        <div class="gallery-card"><img src="assets/image7.jpg" alt="Ministry gallery image 7"></div>
        <div class="gallery-card"><img src="assets/image9.jpg" alt="Ministry gallery image 9"></div>
        <div class="gallery-card"><img src="assets/image10.jpg" alt="Ministry gallery image 10"></div>
        <div class="gallery-card"><img src="assets/image11.jpg" alt="Ministry gallery image 11"></div>
        <div class="gallery-card"><img src="assets/image12.jpg" alt="Ministry gallery image 12"></div>
        <div class="gallery-card"><img src="assets/image13.jpg" alt="Ministry gallery image 13"></div>
        <div class="gallery-card"><img src="assets/image14.jpg" alt="Ministry gallery image 14"></div>
      </div>
    </div>
  </section>
</main>

<footer></footer>
<script src="template.js"></script>
</body>
</html>
